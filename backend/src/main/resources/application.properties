spring.application.name=friends-like-these-backend

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FriendsLikeTheseDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.servlet.session.timeout=${FLTA_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${FLTA_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${FLTA_COOKIE_SAME_SITE:lax}
app.cors.allowed-origins=${FLTA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.bootstrap.username=${FLTA_ADMIN_USERNAME:}
app.admin.bootstrap.email=${FLTA_ADMIN_EMAIL:}
app.admin.bootstrap.password=${FLTA_ADMIN_PASSWORD:}
app.admin.bootstrap.display-name=${FLTA_ADMIN_DISPLAY_NAME:Administrator}
app.google-sheets.sheet-id=${GOOGLE_SHEETS_SHEET_ID:1PGO7fAfxKBBiaLONqabfy1ezFFhb0IQEvXFnWvc3YTo}
app.google-sheets.sheet-name=${GOOGLE_SHEETS_SHEET_NAME:Form Responses 1}
app.registration.form-url=${REGISTRATION_FORM_URL:https://docs.google.com/forms/d/e/1FAIpQLScrIKTorkwZWmBsr-S8YPjJObn4nW5E6aViWcyPOp6zyTLsEg/viewform}
app.registration.sync.enabled=${REGISTRATION_SYNC_ENABLED:true}
app.registration.sync.interval=${REGISTRATION_SYNC_INTERVAL:PT60S}
app.registration.sync.close-grace-period=${REGISTRATION_SYNC_CLOSE_GRACE_PERIOD:PT2M}
app.executor.core-pool-size=${FLTA_EXECUTOR_CORE_POOL_SIZE:2}
app.executor.max-pool-size=${FLTA_EXECUTOR_MAX_POOL_SIZE:4}
app.executor.queue-capacity=${FLTA_EXECUTOR_QUEUE_CAPACITY:32}
